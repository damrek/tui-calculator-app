name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One release per tag: a re-pushed tag waits instead of racing a running release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@v2.2.0

      - run: npm ci

      - run: npm run lint

      - run: npm run test:run

      - run: npm run build

      # Compile the three platform binaries through the package.json scripts
      # (build:linux / build:win / build:mac) so CI and local `npm run dist`
      # cannot drift apart.
      - run: npm run build:all

      # softprops/action-gh-release v3.0.4
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            dist/calculator-linux
            dist/calculator.exe
            dist/calculator-macos
          generate_release_notes: true
          fail_on_unmatched_files: true
